name: Update newsletter ticker

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - claude/hopeful-archimedes-0tb0eh
    paths:
      - .github/workflows/update-feed.yml

permissions:
  contents: write

concurrency:
  group: newsletter-ticker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve and parse ARAC newsletter RSS/Atom
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          url = "https://newsletter.arac-international.org/feed"
          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0 (compatible; NitroNuriTicker/1.0)", "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml;q=0.9, */*;q=0.5"}
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()
          root = ET.fromstring(data)
          ns = {"a": "http://www.w3.org/2005/Atom"}
          entries = root.findall(".//item")
          atom = False
          if not entries:
              entries = root.findall(".//a:entry", ns)
              atom = True
          items = []
          for entry in entries:
              if atom:
                  title = (entry.findtext("a:title", default="", namespaces=ns) or "").strip()
                  link = next((e.attrib.get("href", "") for e in entry.findall("a:link", ns) if e.attrib.get("rel", "alternate") == "alternate"), "")
                  pub = (entry.findtext("a:published", default="", namespaces=ns) or entry.findtext("a:updated", default="", namespaces=ns) or "")
              else:
                  title = (entry.findtext("title") or "").strip()
                  link = (entry.findtext("link") or "").strip()
                  pub = entry.findtext("pubDate") or ""
              if not title or not link.startswith(("https://", "http://")):
                  continue
              date = None
              try:
                  if pub:
                      dt = datetime.fromisoformat(pub.replace("Z", "+00:00")) if atom else parsedate_to_datetime(pub)
                      date = dt.date().isoformat()
              except (ValueError, TypeError, OverflowError):
                  pass
              items.append({"title": title, "link": link, "date": date})
              if len(items) >= 12:
                  break

          if not items:
              raise SystemExit("No usable RSS/Atom entries returned; existing feed.json remains unchanged.")
          with open("feed.json", "w", encoding="utf-8") as f:
              json.dump({"updated": datetime.now(timezone.utc).isoformat(), "items": items}, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Prepared {len(items)} articles from {url}")
          PY
      - name: Commit refreshed ticker feed
        shell: bash
        run: |
          if git diff --quiet -- feed.json; then
            echo "Ticker is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -m "Refresh ARAC Strategic Communications RSS ticker"
          git push
